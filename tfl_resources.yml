resources:
  jobs:
    tfl_daily:
      name: tfl_daily_auto
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/London
      tasks:
        - task_key: check_new_files
          notebook_task:
            notebook_path: ../check_new_files.ipynb
        - task_key: run_pipeline
          depends_on: [check_new_files]
          pipeline_task:
            pipeline_id: ${resources.pipelines.tfl_pipeline.id}
